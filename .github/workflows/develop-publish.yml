name: Publish Develop to GHCR

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: petdiary-ghcr-develop
  cancel-in-progress: true

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/skoun181/petdiary
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run tests
        run: |
          pip install -r requirements.txt
          python -m unittest discover -s tests -v
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build and smoke-test AMD64 and ARM64 images
        run: |
          set -euo pipefail
          trap 'docker rm -f petdiary-ghcr-smoke >/dev/null 2>&1 || true; docker volume rm petdiary-ghcr-smoke-data >/dev/null 2>&1 || true' EXIT
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/$arch" --load \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --cache-from "type=gha,scope=petdiary-develop-$arch" \
              --cache-to "type=gha,mode=max,scope=petdiary-develop-$arch" \
              -t "$IMAGE:sha-$GITHUB_SHA-$arch" .
            docker volume create petdiary-ghcr-smoke-data
            docker run -d --platform "linux/$arch" --name petdiary-ghcr-smoke \
              -p 127.0.0.1:18080:8080 -v petdiary-ghcr-smoke-data:/data \
              --read-only --tmpfs /tmp:size=64m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges:true --init \
              "$IMAGE:sha-$GITHUB_SHA-$arch"
            ok=false
            for i in $(seq 1 60); do
              if curl -fsS http://127.0.0.1:18080/healthz; then ok=true; break; fi
              sleep 2
            done
            if [ "$ok" != true ]; then docker logs petdiary-ghcr-smoke; exit 1; fi
            docker rm -f petdiary-ghcr-smoke
            docker volume rm petdiary-ghcr-smoke-data
          done
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "A newer Develop commit exists; skipping outdated publication."
            exit 0
          fi
          for arch in amd64 arm64; do
            docker push "$IMAGE:sha-$GITHUB_SHA-$arch"
          done
          docker buildx imagetools create -t "$IMAGE:sha-$GITHUB_SHA" \
            "$IMAGE:sha-$GITHUB_SHA-amd64" "$IMAGE:sha-$GITHUB_SHA-arm64"
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "A newer Develop commit exists; skipping develop tag update."
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:develop" "$IMAGE:sha-$GITHUB_SHA"
          docker buildx imagetools inspect "$IMAGE:develop"
          docker buildx imagetools inspect --raw "$IMAGE:develop" | python -c 'import json,sys; m=json.load(sys.stdin); platforms={(x["platform"]["os"],x["platform"]["architecture"]) for x in m["manifests"]}; assert {("linux","amd64"),("linux","arm64")} <= platforms, platforms'
