name: PetDiary CI and Docker Release

on:
  push:
    branches: [stable, develop]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  # Development-only smoke test. Never pushes images or publishes GitHub releases.
  image-smoke:
    needs: test
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build develop Docker image
        run: docker build -t petdiary:develop-ci .
      - name: Smoke test read-only container with persistent SQLite volume
        run: |
          docker run -d --name petdiary-smoke -p 127.0.0.1:18080:8080 \
            -v petdiary-smoke-data:/data --read-only --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges:true --init \
            petdiary:develop-ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs petdiary-smoke
          exit 1
      - name: Validate and live-smoke optional HTTPS proxy
        run: |
          set -euo pipefail
          docker compose -f deploy/compose.develop.https.yaml config --quiet
          cat >/tmp/https-override.yaml <<'EOF'
          services:
            petdiary:
              image: petdiary:develop-ci
          EOF
          docker compose -f deploy/compose.develop.https.yaml -f /tmp/https-override.yaml up -d --no-build
          trap 'docker compose -f deploy/compose.develop.https.yaml -f /tmp/https-override.yaml logs --no-color --tail=35 || true; docker compose -f deploy/compose.develop.https.yaml -f /tmp/https-override.yaml down --remove-orphans || true' EXIT
          # Generate a test-only self-signed cert inside the TLS volume.
          # Docker cp refuses writing into a read-only container, even under /tmp.
          docker run --rm -i --user 10001:10001 \
            -v petdiary-develop-tls:/tls --entrypoint python petdiary:develop-ci - <<'PY'
          from datetime import datetime, timedelta, timezone
          from cryptography import x509
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.x509.oid import NameOID
          from tls_config import install_certificate

          private = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          now = datetime.now(timezone.utc)
          name = x509.Name([x509.NameAttribute(NameOID.COMMON_NAME, "*.example.test")])
          certificate = (x509.CertificateBuilder().subject_name(name).issuer_name(name)
            .public_key(private.public_key()).serial_number(x509.random_serial_number())
            .not_valid_before(now-timedelta(days=1)).not_valid_after(now+timedelta(days=2))
            .add_extension(x509.SubjectAlternativeName([x509.DNSName("*.example.test")]),critical=False)
            .add_extension(x509.BasicConstraints(ca=False,path_length=None),critical=True)
            .sign(private,hashes.SHA256()))
          install_certificate(
              "/tls", certificate.public_bytes(serialization.Encoding.PEM),
              private.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption()),
              "petdiary.example.test")
          PY
          for i in $(seq 1 40); do
            if curl -ksSf --noproxy '*' --resolve petdiary.example.test:4443:127.0.0.1 \
              https://petdiary.example.test:4443/healthz; then
              echo "HTTPS Caddy -> PetDiary health check succeeded."
              exit 0
            fi
            sleep 2
          done
          echo "HTTPS handshake or reverse proxy did not become ready."
          exit 1
      - name: Cleanup
        if: always()
        run: docker rm -f petdiary-smoke || true

  publish:
    needs: test
    if: github.ref == 'refs/heads/stable' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: petdiary-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION"; exit 1; }
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; bump VERSION for a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag already exists without a release; investigate before publishing."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup QEMU
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4
      - name: Setup Docker Buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petdiary:${{ steps.version.outputs.number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/petdiary:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petdiary:stable
      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PetDiary $VERSION" --generate-notes
