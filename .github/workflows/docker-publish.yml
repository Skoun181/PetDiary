name: PetDiary CI and Docker Release

on:
  push:
    branches: [stable, develop]
  pull_request:
    branches: [stable]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  publish:
    needs: test
    if: github.ref == 'refs/heads/stable' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: petdiary-stable-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat VERSION)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION"; exit 1; }
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; bump VERSION for a new release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Tag already exists without a release; investigate before publishing."
            exit 1
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to Docker Hub
        if: steps.version.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Setup QEMU
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v4
      - name: Setup Docker Buildx
        if: steps.version.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        if: steps.version.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petdiary:${{ steps.version.outputs.number }}
            ${{ secrets.DOCKERHUB_USERNAME }}/petdiary:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petdiary:stable
      - name: Create GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "PetDiary $VERSION" --generate-notes
