# Optional HTTPS setup for a separate PetDiary develop instance in Dockhand.
# Replace the existing develop stack YAML (do not create a second develop stack).
# DNS must point at the host. Upload cert and key through http://HOST:8081/settings
# first; until then Caddy waits for a valid certificate.
name: petdiary-develop
services:
  petdiary:
    image: ghcr.io/skoun181/petdiary:develop
    container_name: petdiary-develop
    restart: unless-stopped
    environment:
      TLS_CERT_DIR: /tls
    ports:
      - "8081:8080"
    volumes:
      - petdiary-develop-data:/data
      - petdiary-develop-tls:/tls
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  https:
    image: caddy:2.11.9-alpine
    container_name: petdiary-develop-https
    restart: unless-stopped
    depends_on:
      - petdiary
    user: "10001:10001"
    environment:
      HOME: /tmp
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /caddy-data
    ports:
      - "4443:8443"
    volumes:
      - petdiary-develop-tls:/certs:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /config:size=16m,uid=10001,gid=10001,mode=0700
      - /caddy-data:size=64m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat > /tmp/Caddyfile <<'EOF'
        {
          admin 127.0.0.1:2019
          auto_https off
        }
        :8443 {
          tls /certs/current/fullchain.pem /certs/current/privkey.pem
          encode gzip
          reverse_proxy petdiary:8080
        }
        EOF
        echo "PetDiary HTTPS: Waiting for a certificate uploaded in Settings..."
        until [ -s /certs/current/fullchain.pem ] && [ -s /certs/current/privkey.pem ]; do
          sleep 5
        done
        caddy run --config /tmp/Caddyfile &
        caddy_pid=$$!
        trap 'kill "$$caddy_pid" 2>/dev/null || true' TERM INT
        previous=$$(readlink /certs/current)
        while kill -0 "$$caddy_pid" 2>/dev/null; do
          sleep 10
          next=$$(readlink /certs/current 2>/dev/null || true)
          if [ "$$next" != "$$previous" ]; then
            echo "PetDiary HTTPS: New certificate detected; reloading Caddy."
            if caddy reload --config /tmp/Caddyfile --force; then
              previous="$$next"
            fi
          fi
        done
        wait "$$caddy_pid"

volumes:
  petdiary-develop-data:
    name: petdiary-develop-data
  petdiary-develop-tls:
    name: petdiary-develop-tls
