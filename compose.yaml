services:
  petdiary:
    build: .
    image: petdiary:local
    container_name: petdiary
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      ADMIN_USER: "${ADMIN_USER:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD in .env setzen}"
      API_TOKEN: "${API_TOKEN:?API_TOKEN in .env setzen}"
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY in .env setzen}"
      TZ: "${TZ:-Europe/Berlin}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
    volumes:
      - petdiary-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
volumes:
  petdiary-data:
